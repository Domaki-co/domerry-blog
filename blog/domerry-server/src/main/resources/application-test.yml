server:
  port: 8900
spring:
  config:
    import: optional:file:${APP_LOCAL_SECRET_FILE:/etc/domerry/application-local-secret.yml}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://${MYSQL_HOST:192.168.1.100}:${MYSQL_PORT:3306}/domerry_blog?characterEncoding=UTF-8&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&tinyInt1isBit=false&allowPublicKeyRetrieval=true
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: ${MYSQL_USERNAME:}
          password: ${MYSQL_PASSWORD:}
        slave:
          url: jdbc:mysql://${MYSQL_HOST:192.168.1.100}:${MYSQL_PORT:3306}/test?characterEncoding=UTF-8&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&tinyInt1isBit=false&allowPublicKeyRetrieval=true
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: ${MYSQL_USERNAME:}
          password: ${MYSQL_PASSWORD:}

  redis:
    host: ${REDIS_HOST:192.168.1.100}
    port: ${REDIS_PORT:6379}
    timeout: 10000
    password: ${REDIS_PASSWORD:}
    database: 8

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: false
  basic:
    enable: false
  setting:
    language: zh_cn
#==============================公众号配置==============================
wechat:
  app-id:
  # 公众号AppSecret
  secret:
  # 公众号Token
  token:
  # 公众号AES Key
  aesKey:

#==============================豆包推理AI配置=======================================
ai:
  # API Key
  apiKey:
  baseUrl: https://ark.cn-beijing.volces.com/api/v3
  # 推理接入点ID
  model:

#==============================文件地址配置=======================================
dromara:
  x-file-storage: #文件存储配置
    default-platform: minio-1 #默认使用的存储平台
    thumbnail-suffix: ".min.jpg" #缩略图后缀，例如【.min.jpg】【.png】
    local-plus:
      - platform: local-plus-1 # 存储平台标识
        enable-storage: false  #启用存储
        enable-access: true #启用访问（线上请使用 Nginx 配置，效率更高）
        domain: http://127.0.0.1:8800/localFile/ # 访问域名，例如：“http://127.0.0.1:8030/file/”，注意后面要和 path-patterns 保持一致，“/”结尾，本地存储建议使用相对路径，方便后期更换域名
        base-path: local-plus/ # 基础路径
        path-patterns: /localFile/** # 访问路径
        storage-path: D:/Temp/ # 存储路径
    qiniu-kodo:
      - platform: qiniu-kodo-1 # 存储平台标识
        enable-storage: false  # 启用存储
        access-key:
        secret-key:
        bucket-name: ${QINIU_BUCKET:your-bucket}
        domain: ${QINIU_DOMAIN:https://your-cdn.example/} # 访问域名，注意“/”结尾，例如：http://abc.hn-bkt.clouddn.com/
        base-path: base/ # 基础路径
    minio:
      - platform: minio # 存储平台标识
        enable-storage: true  # 启用存储
        access-key: ${MINIO_ACCESS_KEY}
        secret-key: ${MINIO_SECRET_KEY}
        end-point: ${MINIO_ENDPOINT:https://minio.doma.cool/}
        bucket-name: ${MINIO_BUCKET:blog}
        domain: ${MINIO_DOMAIN:https://minio.doma.cool/blog/} # 访问域名，注意“/”结尾，例如：http://abc.hn-bkt.clouddn.com/
        base-path: blog/ # 基础路径

#==============================邮箱配置=======================================
# 发件邮箱换成自己的账号,密码由运行环境变量 MAIL_PASSWORD 提供
mail:
  smtp:
    host: smtp.qq.com
    port: 587
    email:
    password: ${MAIL_PASSWORD:}
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
