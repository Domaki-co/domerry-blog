<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon"  href="%VITE_APP_LOGO%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="%VITE_APP_KEYWORDS%" />
    <meta
      name="description"
      content="%VITE_APP_DESCRIPTION%"
    />
    <title>%VITE_APP_TITLE%</title>
    <!--
      Font Awesome 5.15.4 用 <link> 引入而不是在 App.vue 里 @import：CSS 的 @import 无法
      携带 integrity，第三方 CDN 被投毒时前端无从校验。sha384 由本地下载的 all.min.css
      计算，并已与 cdnjs API 给出的 sha512 交叉核对一致。
    -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm"
      crossorigin="anonymous"
    />
    <!--
      主题必须在首屏绘制前落到 <html> 上，否则深色模式会先闪一下浅色底。
      这段逻辑和 src/utils/theme.js 的 getThemeMode 保持一致，改一处要同步另一处。
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('theme-mode')
          if (!mode) {
            mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (mode === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
        } catch (e) { /* 隐私模式下 localStorage 不可用，按浅色处理 */ }
      })()
    </script>
    <script src="/static/js/index.js"></script>


    <script>
      var _hmt = _hmt || [];
      (function() {
        var hm = document.createElement("script");
        // 统计脚本不参与首屏，显式 async，别让它和主包抢带宽
        hm.async = true;
        hm.src = "https://hm.baidu.com/hm.js?725f624fdb6a307fa04e422db6d078fd";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
      })();
      </script>

  </head>
  <body>
    <!-- SEO：原始 HTML 中始终存在的 h1（SPA 渲染不覆盖），视觉隐藏但爬虫和读屏器可见 -->
    <h1 class="seo-only">%VITE_APP_TITLE%</h1>
    <style>
      .seo-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
