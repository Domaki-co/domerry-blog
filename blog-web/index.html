<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon"  href="%VITE_APP_LOGO%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="%VITE_APP_KEYWORDS%" />
    <meta
      name="description"
      content="%VITE_APP_DESCRIPTION%"
    />
    <title>%VITE_APP_TITLE%</title>
    <!--
      Font Awesome 5.15.4 用 <link> 引入而不是在 App.vue 里 @import：CSS 的 @import 无法
      携带 integrity，第三方 CDN 被投毒时前端无从校验。sha384 由本地下载的 all.min.css
      计算，并已与 cdnjs API 给出的 sha512 交叉核对一致。
    -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm"
      crossorigin="anonymous"
    />
    <!--
      图标字体提前拉：工具栏/菜单的 <i class="fas …"> 在字体就绪前是空白方块（有的浏览器
      会先显示 .notdef 或干脆跳一下），预取这三个 woff2 能省掉一次 CSS→字体串行等待。
      只预取实际用到的三个：fas（主）、far、fab。
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/webfonts/fa-solid-900.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/webfonts/fa-regular-400.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/webfonts/fa-brands-400.woff2"
    />
    <!--
      主题必须在首屏绘制前落到 <html> 上，否则深色模式会先闪一下浅色底。
      这段逻辑和 src/utils/theme.js 的 getThemeMode 保持一致，改一处要同步另一处。
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('theme-mode')
          if (!mode) {
            mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (mode === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
        } catch (e) { /* 隐私模式下 localStorage 不可用，按浅色处理 */ }
      })()
    </script>
    <!--
      首屏封面预热：hero.vue 会把上一次成功加载的封面地址写进 localStorage，这里在解析
      HTML 阶段就把大图请求发出去，早于 1.4MB 主包 —— 等 Vue 挂载时图往往已经在缓存里了，
      不会先露一块墨底。key 与 src/views/home/components/hero.vue 保持一致。
      值来自 localStorage、任何脚本都能改写，所以只放行 http(s) 与站内绝对路径
      （排除 //host 形式的协议相对地址，免得被写成任意第三方请求）。
    -->
    <script>
      (function () {
        try {
          var cover = localStorage.getItem('hero-cover-url')
          if (!cover) return
          var sameOrigin = cover.charAt(0) === '/' && cover.charAt(1) !== '/'
          if (!sameOrigin && !/^https?:\/\//i.test(cover)) return
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.href = cover
          link.setAttribute('fetchpriority', 'high')
          document.head.appendChild(link)
        } catch (e) { /* 隐私模式下 localStorage 不可用，跳过预热 */ }
      })()
    </script>
    <script src="/static/js/index.js"></script>


    <script>
      var _hmt = _hmt || [];
      (function() {
        var hm = document.createElement("script");
        // 统计脚本不参与首屏，显式 async，别让它和主包抢带宽
        hm.async = true;
        hm.src = "https://hm.baidu.com/hm.js?725f624fdb6a307fa04e422db6d078fd";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
      })();
      </script>

  </head>
  <body>
    <!-- SEO：原始 HTML 中始终存在的 h1（SPA 渲染不覆盖），视觉隐藏但爬虫和读屏器可见 -->
    <h1 class="seo-only">%VITE_APP_TITLE%</h1>
    <style>
      .seo-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
