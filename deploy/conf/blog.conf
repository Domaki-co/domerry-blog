server {
 #   listen       80;
    listen       443 ssl;
    http2        on;
     # 替换点1：改成你的站点域名
     server_name  blog.your-domain.example;
     client_max_body_size   100m;
#         #SSL 默认访问端口号为 443
 ssl_certificate  cert/cert.pem;
 ##请填写私钥文件的相对路径或绝对路径
 ssl_certificate_key cert/key.pem;
 ssl_session_timeout 5m;
 #请按照以下套件配置，配置加密套件，写法遵循 openssl 标准。
 ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
 #请按照以下协议配置
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_prefer_server_ciphers on;

 # ===== 传输压缩：js/css/json/svg/xml 先压缩再传输（含代理的后端 JSON、sitemap.xml） =====
 gzip on;
 gzip_min_length 1k;
 gzip_comp_level 5;
 gzip_vary on;
 gzip_proxied any;
 gzip_types text/css application/javascript application/json application/xml image/svg+xml;

        location /static/{
		root /usr/share/nginx/html/blog/web;
		# 非哈希命名的静态资源（内容会直接编辑，如 /static/js/index.js），短缓存
		expires 1d;
		}
        # 带内容 hash 的构建产物：一年强缓存，发版即换新名生效
        location /assets/ {
                root /usr/share/nginx/html/blog/web;
                add_header Cache-Control "public, max-age=31536000, immutable";
        }
	location / {
                root  /usr/share/nginx/html/blog/web/;
                try_files $uri $uri/ /index.html;
                index  index.html index.htm;
                proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
                # SPA 入口（含前端路由兜底返回的 index.html）不缓存，保证发版即时生效
                add_header Cache-Control "no-cache";
    }
        # 站点地图：后端动态生成（/api/sitemap.xml），robots.txt 中已声明
        # 替换点2：以下所有 http://your-backend.example:8900 都是后端服务地址，请替换为你的实际地址
        location = /sitemap.xml {
                proxy_pass http://your-backend.example:8900/api/sitemap.xml;
                proxy_set_header Host $host;
                # 覆盖客户端自带的同名头，后端按 IP 分桶限流依赖这两个值可信
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $remote_addr;
                add_header Cache-Control "public, max-age=3600";
        }
        location ^~/api/ {
                proxy_pass http://your-backend.example:8900/;
		proxy_set_header X-Forwarded-Proto $scheme;  # 传递协议类型
		# 覆盖客户端自带的同名头，后端按 IP 分桶限流依赖这两个值可信
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		add_header 'Access-Control-Allow-Origin' 'https://blog.your-domain.example';
    		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    		add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
        }
        location ^~/blog/ {
           proxy_pass http://your-backend.example:8900/;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $remote_addr;
           proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ^~/doma/ {
                proxy_pass http://your-backend.example:8900/;
                proxy_set_header X-Forwarded-Proto $scheme;  # 传递协议类型
                # 覆盖客户端自带的同名头，后端按 IP 分桶限流依赖这两个值可信
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $remote_addr;
                add_header 'Access-Control-Allow-Origin' 'https://blog.your-domain.example';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
        }
        location ^~/doma/websocket/ {  # WebSocket服务路径
            proxy_pass http://your-backend.example:8900/websocket/;  # 后端WebSocket服务器地址
            proxy_http_version 1.1;  # 启用HTTP/1.1
            proxy_set_header Upgrade $http_upgrade;  # 处理协议升级
            proxy_set_header Connection "upgrade";  # 标记为WebSocket连接
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;

            # 长连接优化
            proxy_read_timeout 86400s;  # 保持连接超时时间
            proxy_send_timeout 86400s;
            proxy_buffer_size 128k;     # 缓冲区大小优化
            proxy_buffers 4 256k;
        }


    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}

