server {
    listen 80;
    listen 443 ssl;
    # 替换点1：改成你的后台域名
    server_name admin.your-domain.example;
    client_max_body_size 100m;

    # SSL配置保持不变
    ssl_certificate cert/cert.pem;
    ssl_certificate_key cert/key.pem;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ✅ 关键修改1：全局CORS配置（使用变量和always参数）
    add_header 'Access-Control-Allow-Origin' '$http_origin' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Max-Age' 3600 always;

    # ✅ 关键修改2：统一OPTIONS处理
    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        root /usr/share/nginx/html/blog/admin/;
        try_files $uri $uri/ /index.html;
        index index.html index.htm;
        proxy_set_header Host $host;  # 保留原始请求的 Host 头信息
        proxy_set_header X-Real-IP $remote_addr;  # 传递真实客户端的 IP 地址
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖客户端自带的同名头，只传真实对端 IP
        proxy_set_header X-Forwarded-Proto $scheme;  # 传递请求的协议（http 或 https）
    }

    location ^~/doma/ {
        # 替换点2：改成后端服务地址
        proxy_pass http://your-backend.example:8900/;
        
        # ✅ 关键修改3：反向代理时移除CORS头防止覆盖
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';

        # 保留其他proxy_set_header配置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 错误页面配置保持不变
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

