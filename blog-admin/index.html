<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%VITE_APP_LOGO%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="%VITE_APP_KEYWORDS%" />
    <meta name="description" content="%VITE_APP_DESCRIPTION%" />
    <title>%VITE_APP_TITLE%</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('domerry_site_config');
          if (raw) {
            var conf = JSON.parse(raw);
            var icon = conf.favicon || conf.logo;
            if (icon) {
              var old = document.querySelectorAll("link[rel*='icon']");
              old.forEach(function(el) { el.remove(); });
              var link = document.createElement('link');
              // 按扩展名给 MIME：后台现在允许传 png/svg/webp 图标，
              // 一律写 image/x-icon 会让这些图标在部分浏览器里不显示
              var ICON_TYPES = {
                ico: 'image/x-icon', png: 'image/png', svg: 'image/svg+xml',
                gif: 'image/gif', webp: 'image/webp', jpg: 'image/jpeg',
                jpeg: 'image/jpeg', bmp: 'image/bmp', avif: 'image/avif'
              };
              var m = /\.([a-z0-9]+)(?:[?#]|$)/i.exec(icon);
              var type = m && ICON_TYPES[m[1].toLowerCase()];
              if (type) link.type = type;
              link.rel = 'shortcut icon';
              link.href = icon;
              document.head.appendChild(link);
            }
            if (conf.name) {
              document.title = conf.name;
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
